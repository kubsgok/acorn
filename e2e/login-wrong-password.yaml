# A wrong password shows a generic message and stays on the Login screen.
# Run:  maestro test -e APP_ID=<bundle id> -e E2E_EMAIL=<test user> e2e/login-wrong-password.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: 'Log in'
- tapOn: 'Email address'
- inputText: ${E2E_EMAIL}
- tapOn: 'Password'
- inputText: 'definitely-not-the-password'
- tapOn: 'Log in'
- assertVisible: 'Email or password is incorrect.'
- assertVisible: 'Welcome back'
